services:
  web:
    build:
      context: .
      dockerfile: infra/public.Dockerfile
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./.env:/app/.env:ro
      - public-runtime:/app/data/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=10)"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
volumes:
  public-runtime:
