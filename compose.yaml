services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: chargeops
      POSTGRES_USER: chargeops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U chargeops]
      interval: 5s
      retries: 12
  api:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    command: [uvicorn, services.main:app, --host, 0.0.0.0, --port, '8000']
    environment:
      DATABASE_URL: postgresql://chargeops:${POSTGRES_PASSWORD:-local-development-only}@db:5432/chargeops
    ports: [127.0.0.1:8000:8000]
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
      - ./reports:/app/reports
      - .:/sources:ro
    depends_on:
      db: {condition: service_healthy}
  worker:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    command: [python, -m, services.worker, --loop]
    environment:
      DATABASE_URL: postgresql://chargeops:${POSTGRES_PASSWORD:-local-development-only}@db:5432/chargeops
    volumes: [./data:/app/data, ./.env:/app/.env:ro]
    depends_on:
      db: {condition: service_healthy}
  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    ports: [127.0.0.1:8080:80]
    depends_on: [api]
volumes:
  pgdata:
